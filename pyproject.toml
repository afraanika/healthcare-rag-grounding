[project]
name = "healthcare-rag-grounding"
version = "0.1.0"
description = "RAG pipeline that grounds answers to healthcare questions in cited source PDFs, using a local LLM and vector store."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "ollama>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
markers = [
    "integration: requires a running Ollama daemon and/or network access",
]
